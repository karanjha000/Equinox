# ===================================
# Database Configuration (Production - PostgreSQL)
# ===================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===================================
# Security & JWT Configuration (Production)
# ===================================
# Strict requirement for JWT_SECRET environment variable
jwt.secret=${JWT_SECRET}

# ===================================
# CORS Configuration (Production)
# ===================================
app.cors.allowed-origins=https://equinox-b2x1.onrender.com

# ===================================
# Mail Configuration (Production)
# ===================================
spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.frontend.url=https://equinox-b2x1.onrender.com
